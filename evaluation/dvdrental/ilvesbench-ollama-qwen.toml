[llm]
backend = "openai_compatible"
base_url = "http://127.0.0.1:11434/v1/chat/completions"
model = "qwen2.5:7b-instruct"
api_key = ""
timeout_seconds = 300

[postgres]
host = "127.0.0.1"
port = 5432
user = "llm"
password = "llm"
original_database = "dvdrental"
new_database = "dvdrental_ilvesbench_qwen"
admin_database = "postgres"
schemas = ["public"]
connect_timeout_seconds = 10

[logs]
path = "../../data/postgresql.log"
max_lines = 5000

[workload]
path = "workload.sql"

[postgresql_conf]
path = "../../postgres-config/postgresql.conf"

[docker]
postgres_container_name = "ilvesbench-postgres"
prefer_container_snapshot = true

[pgbench]
enabled = false
command = "pgbench"
duration_seconds = 30
clients = 4
jobs = 1

[energy]
enabled = false
estimated_cpu_watts = 45.0
estimated_watts_per_cpu = 12.0
co2_grams_per_kwh = 110.0

[storage]
sqlite_path = "../../data/dvdrental_qwen_evaluation.sqlite3"
artifact_dir = "../../data/artifacts/dvdrental_qwen"

[web]
host = "127.0.0.1"
port = 8085
