[llm]
backend = "openai_compatible"
base_url = "https://api.openai.com/v1/chat/completions"
model = "gpt-5.6-sol"
api_key = ""
api_key_file = "secrets/openai_api_key"
timeout_seconds = 180

[schema_chunking]
# The full prompt is used when it fits. Larger schemas are grouped into
# relationship-aware chunks, but a single table is never split across prompts.
enabled = true
context_window_tokens = 32768
reserved_output_tokens = 8000
safety_margin_tokens = 2048
# Conservative estimator used for OpenAI-compatible models without a local tokenizer.
estimated_characters_per_token = 3.0

[postgres]
host = "127.0.0.1"
port = 5432
user = "llm"
password = "llm"
original_database = "mvp_db"
new_database = "mvp_db_new"
admin_database = "postgres"
schemas = ["public"]
connect_timeout_seconds = 10

[logs]
path = "data/postgresql.log"
max_lines = 5000

[workload]
path = "data/workload.sql"

[postgresql_conf]
path = "postgres-config/postgresql.conf"

[docker]
postgres_container_name = "ilvesbench-postgres"
prefer_container_snapshot = true

[pgbench]
enabled = true
command = "pgbench"
duration_seconds = 30
clients = 4
jobs = 1
# pgbench emits one persisted TPS/latency sample at this interval.
progress_interval_seconds = 1

[energy]
enabled = true
# Optional: set a measured host/container wattage for better estimates.
# If omitted, IlvesBench estimates from detected CPU count.
estimated_cpu_watts = 45.0
estimated_watts_per_cpu = 12.0
co2_grams_per_kwh = 110.0

# Optional NETIO 4KF / PowerBOX JSON API. Leave url empty when no NETIO is attached.
# Do not commit real credentials; use a separate local ilvesbench.toml.
[netio]
url = "" # e.g. "http://192.168.1.78/netio.json"
username = ""
password = ""
poll_interval_seconds = 1.0
timeout_seconds = 5.0

[storage]
sqlite_path = "data/ilvesbench_runs.sqlite3"
artifact_dir = "data/artifacts"

[web]
host = "127.0.0.1"
port = 8081
