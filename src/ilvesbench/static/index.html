<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IlvesBench</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="app-header">
        <div class="brand-block">
          <span class="eyebrow">PostgreSQL benchmark workspace</span>
          <h1>IlvesBench</h1>
        </div>
        <p>Pipeline state, database readiness, workload rewrite, physical design, and comparison.</p>
      </header>

      <section class="panel controls">
        <label class="field">
          <span>Config path</span>
          <input id="configPath" type="text" value="ilvesbench.example.toml">
        </label>
        <label class="field">
          <span>Source database</span>
          <select id="originalDatabase">
            <option value="mvp_db">mvp_db</option>
          </select>
        </label>
        <label class="field">
          <span>Target database</span>
          <input id="newDatabase" type="text" value="mvp_db_new">
        </label>
        <label class="field">
          <span>Schemas</span>
          <input id="schemas" type="text" value="public">
        </label>
        <label class="field">
          <span>Workload file path (optional)</span>
          <input id="workloadPath" type="text" placeholder="data/workload.sql">
          <small class="field-help">Relative paths resolve from the config file directory.</small>
        </label>
        <div class="actions">
          <button id="runButton" class="primary">Start run</button>
          <button id="discoverButton">Discover databases</button>
          <button id="llmButton">Test LLM</button>
          <button id="postgresButton">Check PostgreSQL</button>
          <button id="refreshButton">Refresh</button>
        </div>
        <div id="dbSelectionStatus" class="selection-status"></div>
        <div id="workloadSourceStatus" class="selection-status workload-source-status"></div>
        <div id="postgresStatus" class="connection-status" hidden></div>
        <pre id="statusBox" class="status-box">Waiting for input.</pre>
      </section>

      <section class="panel">
        <div id="runs" class="run-grid"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
